# The surface the optimisation loop is allowed to change.
#
# Everything the loop may touch lives here. Everything it may not touch lives in
# code or in taxonomy.yml. That boundary is the whole safety model: the loop can
# change what a page says, never what the system is willing to assert about
# someone's company.
#
# Every run records the config version in force, which is what makes a revert
# possible. Without that column in the log, "roll back to the last good config"
# is a sentence rather than an operation.

version: 3
changed: 2026-09-24
changed_by: human
rationale: initial config, no loop data yet

# ---------------------------------------------------------------------------
# Variables the FAST loop may change. Weekly, or every 30 completed runs.
# One variable per surface per cycle, because at low n concurrent changes are
# unattributable and the honest answer is that you would not know which one did it.
# ---------------------------------------------------------------------------

landing:
  headline: "Which three senior people does your startup actually need right now?"
  subhead: "Enter your website. Get a leadership gap read in about ninety seconds, with the evidence behind every claim."
  cta: "Run the diagnostic"
  fields_before_result: 1        # the URL only. Email is asked for after the value lands.

confirmation:
  question: "Is this your company?"
  optional_fields_position: after   # after | before

report:
  cta_primary: "Book a ten minute call"
  cta_email: "Email me a copy"
  cta_share: "Send to my co-founder or board"
  unknowns_framing: "What we could not see"
  gap_order: confidence_desc        # confidence_desc | taxonomy_order

followup:
  subject: "Your leadership gap read, {company}"
  first_line: "Three things your public footprint suggests, and the two questions it could not answer."

# ---------------------------------------------------------------------------
# Thresholds. The loop may PROPOSE a change here. A human merges it.
# These decide what the system is willing to say about a real company, which is
# not a copy test.
# ---------------------------------------------------------------------------

thresholds:
  min_evidence_fields: 4
  require_leadership_visibility: true
  max_gaps: 3

# ---------------------------------------------------------------------------
# Loop governance
# ---------------------------------------------------------------------------

loop:
  fast:
    cadence_days: 7
    or_after_runs: 30
    min_sample_per_variant: 30      # nothing is promoted below this
    max_changes_per_cycle: 1
    may_change: [landing, confirmation, report, followup]

  slow:
    cadence_days: 30
    or_after_reviewed_briefs: 100
    may_change: []                  # proposal only
    may_propose: [thresholds, taxonomy]
    merge: human

  guardrails:
    # Any breach reverts to the last known good config version and halts the loop.
    # These exist because the loop could otherwise learn to raise bookings by
    # naming more dramatic gaps, which is the failure mode that costs the most and
    # shows up in the metrics the latest.
    max_brief_reject_rate: 0.25
    min_gap_accuracy_yes_or_partly: 0.70
    min_refusal_rate: 0.05          # a loop that never refuses has learned to guess
    max_cost_per_run_usd: 0.25
    max_cost_per_week_usd: 50.00

# ---------------------------------------------------------------------------
# What the report says about Connectd.
#
# These are facts about Connectd's business that this build has no access to, so
# they live here rather than being invented in the renderer. Every line below is
# a placeholder written to be true-but-vague; replace each with the real thing on
# day one and the report gets sharper without a code change.
# ---------------------------------------------------------------------------

offer:
  # Replace with the real figure, e.g. "Around 4,000 senior operators".
  # Leave blank and the report falls back to describing curation without a number.
  bench_size: ""
  bench_line: >
    Every one of them has been through our vetting and is actively looking for a
    board or advisory seat, so this is a shortlist we draw from, not a directory
    you search yourself.

  # What actually happens on the call. Replace with Connectd's real process.
  process:
    - A short call with someone on our team, usually the same week
    - We come back with named people against the gaps you agree are real
    - You meet them. If the fit is wrong, you say so and we go again
    - Three to six months, unpaid, no notice period and no fee at any point

  # Where "book a call" actually goes. Replace with Connectd's real booking
  # link. Left blank, the report shows no booking button rather than a dead one.
  booking_url: "https://connectd.co/contact"

  # Shown per gap, turning the profile into an ask.
  per_gap_cta: "Ask us who we have for this"
